# =========================================================
# 悦知精灵 & 知享优 OpenResty 智能网关防封配置文件
# 部署路径建议: /etc/nginx/conf.d/gateway.conf
# =========================================================

# HTTP 泛域名与入口接入
server {
    listen 80;
    server_name *.entry1.com *.entry2.com *.youxiangtd.com; # 匹配所有泛入口域名

    # 开启 gzip 压缩加速 H5 混淆包加载
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain application/javascript text/css application/json;

    location /reader/ {
        # 1. 使用 OpenResty Lua 模块直连 Redis 读取黑名单状态 (高性能零延迟)
        access_by_lua_block {
            local redis = require "resty.redis"
            local red = redis:new()
            red:set_timeout(1000) -- 1s 超时

            local ok, err = red:connect("127.0.0.1", 6379)
            if not ok then
                ngx.log(ngx.ERR, "Failed to connect Redis: ", err)
                return
            end

            -- 提取主域名
            local host = ngx.var.host
            local is_blocked, err = red:sismember("blocked_domains", host)

            if is_blocked == 1 then
                -- 从活跃池获取存活域名
                local new_domain, err = red:srandmember("active_entry_domains")
                if new_domain and new_domain ~= ngx.null then
                    -- 生成随机二级前缀
                    local random_prefix = string.format("%x", math.random(10000000, 99999999))
                    local redirect_url = "http://" .. random_prefix .. "." .. new_domain .. ngx.var.request_uri
                    return ngx.redirect(redirect_url, 302)
                end
            end
        }

        # 2. 域名正常，反向代理传递给 Node.js 防封调度后端 / 静态服务
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 接口直接反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端静态资源混淆路径强缓存
    location /static8/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
