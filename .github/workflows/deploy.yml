name: Deploy to GitHub Pages

on:
  push:
  # 每次推送到 main 分支时自动触发部署
    branches: [ main ]

  # 允许手动从 Actions 页面触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以便能够向 GitHub Pages 推送
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # GitHub Pages 不支持 SPA rewrite。复制一份 404.html 作为兜底，
      # 让 /reader/go、/reader/mine/focusCode 这类前端路由刷新后仍能渲染。
      - name: SPA fallback (404.html)
        run: cp reader/index.html reader/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reader # 对应你当前的自定义输出目录